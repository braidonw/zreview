[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/app",
    "crates/domain",
    "crates/git",
    "crates/github",
    "crates/review",
    "crates/session",
    "crates/settings",
    "crates/store",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/braidon/zreview"

[workspace.dependencies]
app = { path = "crates/app" }
domain = { path = "crates/domain" }
git = { path = "crates/git" }
github = { path = "crates/github" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
review = { path = "crates/review" }
session = { path = "crates/session" }
settings = { path = "crates/settings" }
store = { path = "crates/store" }
thiserror = "2.0"
toml = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
