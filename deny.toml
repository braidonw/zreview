# Enforces the licensing boundary PLAN section 3 depends on.
#
# ZReview is dual MIT/Apache-2.0 and must stay linkable that way, so a
# strong-copyleft dependency appearing here is the specific failure this guards
# against. `cargo deny check` in CI is what makes that boundary enforced rather
# than merely intended.

[graph]
# Only the platforms ZReview is built for. Checking every target would demand
# licence decisions for crates that are never compiled, such as UEFI and Windows
# backends pulled in by conditional dependencies.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[licenses]
# Anything not listed is a build failure, so a new copyleft dependency cannot
# arrive unnoticed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "NCSA",
    # Weak, file-level copyleft. Reached through tauri-utils' CSS parsing
    # (cssparser, selectors, via dom_query) and its own `dirs` dependency
    # (option-ext). None of it extends to code that merely links it. Recorded
    # here as a deliberate decision, and one of the items PLAN wants confirmed
    # by legal review before distribution.
    "MPL-2.0",
]
# Fail on a dependency whose licence cannot be determined at all.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[bans]
# Tauri's own tree brings more than one version of common crates, such as toml
# and winnow, through its build-time and runtime dependency graphs. Enforcing
# one version each would be a fight with an upstream we do not control.
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates depend on each other by path with no version requirement,
# which is not the unpinned-external-dependency problem this check is for.
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"
# Security advisories always fail. Unmaintained ones are scoped to crates this
# workspace chose. Tauri's tree currently carries six (paste, unic-char-property,
# unic-char-range, unic-common, unic-ucd-ident, unic-ucd-version), none of them
# vulnerabilities and none with a safe upgrade available to us. Failing CI on
# those would make it permanently red over something only an upstream can fix,
# while still leaving us blind to a crate we add ourselves. This way round, the
# check stays actionable.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
