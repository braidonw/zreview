[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Internal to the application; the crate names here are not reserved on crates.io
# and nothing outside this workspace depends on them.
publish = false

[dependencies]
app.workspace = true
domain.workspace = true
gpui.workspace = true
# Grapheme boundaries, so a caret cannot land inside an emoji and deleting one
# character does not leave a broken cluster.
unicode-segmentation = "1.12"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
